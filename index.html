<!DOCTYPE html>
<html lang="de">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WO Trainer Uboot</title>
    <link rel="stylesheet" href="data/stylesheets/mainstyle_body.css" />

    <script src="content/MEN/MEN.js"></script>
    <script src="content/DOT/DOT.js"></script>

    <script defer src="data/libs/katex/katex.min.js"></script>
    <script defer src="data/libs/katex/contrib/auto-render.min.js"

</head>
<body>

    <header>
        <div class="header_logo">
            <img src="data/pictures/icons/military/icon_1ug.png" class="header_icon" alt="1.Ubootgeschwader" />
            <img src="data/pictures/icons/military/icon_azu.png" class="header_icon" alt="Ausbildungszentrum Uboote" />
        </div>
        <div class="header_title">
            <div>WO-Trainer Uboote</div>
            <div id="version_number">Version 0.9</div>
        </div>
    </header>

                <button class="nav_subbutton" id="SPL_OSL">OSL und TSL<img class="icon_submenu" src="data/pictures/icons/submenu/icon_roman_I.webp"></button>
                <button class="nav_subbutton" id="SPL_RSL">RSL<img class="icon_submenu" src="data/pictures/icons/submenu/icon_roman_II.webp"></button>
                <button class="nav_subbutton" id="SPL_TCPA">tCPA<img class="icon_submenu" src="data/pictures/icons/submenu/icon_roman_III.webp"></button>

                <button class="nav_subbutton" id="CEP_BAS">Basis Trainer<img class="icon_submenu" src="data/pictures/icons/submenu/icon_roman_II.webp"></button>
                <button class="nav_subbutton" id="CEP_ELI">Elite Trainer<img class="icon_submenu" src="data/pictures/icons/submenu/icon_roman_III.webp"></button>

            <button class="nav_button" id="LIV">Lookinterval <img class="icon" src="data/pictures/icons/icon_LI.webp"></button>
                <button class="nav_subbutton" id="LIV_GK">Gefahrenkreis<img class="icon_submenu" src="data/pictures/icons/submenu/icon_roman_I.webp"></button>
                <button class="nav_subbutton" id="LIV_LIS">Lookinterval Seeraum<img class="icon_submenu" src="data/pictures/icons/submenu/icon_roman_I.webp"></button>
                <button class="nav_subbutton" id="LIV_LIB">Lookinterval Fahrzeug<img class="icon_submenu" src="data/pictures/icons/submenu/icon_roman_I.webp"></button>

            <footer>

                    <img id="slideroben" class="slider" src="data/pictures/slideruler/ruler_oben.png" />
                    <img id="slidermitte" class="slider" src="data/pictures/slideruler/slider.png" />
                    <img id="sliderunten" class="slider" src="data/pictures/slideruler/ruler_unten.png" />
                </div>
                <div class="always_visible">
                    <button id="HelpButton">Hilfe</button>
                    Öffentlich
                    <button id="SliderToggleButton"><img class="icon" src="data/pictures/slideruler/icon.png"></button>
                </div>
            </footer>

        </div>

    </div>





</body>
</html>
